name: GTA 6 Video Finder Bot

on:
  schedule:
    # يعمل 3 مرات في اليوم بتوقيت UTC (08:00, 16:00, 00:00)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً في أي وقت للتجربة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود من المستودع
        uses: actions/checkout@v4

      - name: تثبيت بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل البوت
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python bot.py